<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a class="logo" href="index.html"></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a class="active" href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-heading">
    <p class="eyebrow">SAY HELLO</p>
    <h1>Let's <span>Connect</span></h1>
    <p>I'd love to hear from you!</p>
</section>

<main class="section contact-layout">
    <div>
        <h2>Thanks for visiting! ♡</h2>
        <p>
            I am learning web development and always welcome
            feedback, ideas, and opportunities to learn.
        </p>
        <p class="contact-detail">💌 Email: NazCh@example.com</p>
        <p class="contact-detail">🌷 Location: Pakistan</p>
    </div>

    <form class="contact-form"
          action="NazCh:yourname@example.com"
          method="post"
          enctype="text/plain">

        <label for="name">Your Name</label>
        <input id="name" name="Name" type="text"
               placeholder="Enter your name" required>

        <label for="email">Your Email</label>
        <input id="email" name="Email" type="email"
               placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" name="Message" rows="5"
                  placeholder="Write your message..."
                  required></textarea>

        <button class="button" type="submit">Send Message ↗</button>
        
    </form>
</main>

<footer>Made with ♡ | 2026</footer>
</body>
</html>
